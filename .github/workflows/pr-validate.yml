name: PR Market Validation & Dual Approval

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Market review event"]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  prepare:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/market-recheck')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      number: ${{ steps.pr.outputs.number }}
      author: ${{ steps.pr.outputs.author }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const event = context.payload;
            let number = event.pull_request?.number || event.issue?.number;
            if (context.eventName === 'workflow_run') {
              const run = event.workflow_run;
              if (run.event !== 'pull_request_review') return;
              number = run.pull_requests?.[0]?.number;
              if (!number) number = Number(/^Market review for PR #(\d+)$/.exec(run.display_title || '')?.[1]);
            }
            if (!Number.isSafeInteger(number) || number <= 0) return;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number:number});
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== owner + '/' + repo) return;
            await github.rest.repos.createCommitStatus({owner, repo, sha:pr.head.sha, context:'market/pr-validate', state:'pending', description:'Verifying market files and current approvals'});
            core.setOutput('number',number);
            core.setOutput('author',pr.user.login);
            core.setOutput('head',pr.head.sha);
            core.setOutput('base',pr.base.sha);

  validate:
    needs: prepare
    if: needs.prepare.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approvers: ${{ steps.reviews.outputs.approvers }}
      reviews_read: ${{ steps.reviews.outputs.read }}
    steps:
      - name: Check out trusted rules from the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: rules
          persist-credentials: false
      - name: Check out proposed merge as input data
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.prepare.outputs.number }}/merge
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact PR and base revisions
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
        run: |
          test "$(git -C candidate rev-parse HEAD^1)" = "$BASE"
          test "$(git -C candidate rev-parse HEAD^2)" = "$HEAD_SHA"
          git -C candidate diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/market-changed"
      - name: Read current GitHub reviews
        id: reviews
        uses: actions/github-script@v7
        env:
          NUMBER: ${{ needs.prepare.outputs.number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
        with:
          script: |
            const {currentApprovers} = await import(process.env.GITHUB_WORKSPACE + '/rules/scripts/reviews.mjs');
            const reviews = await github.paginate(github.rest.pulls.listReviews,{...context.repo,pull_number:Number(process.env.NUMBER),per_page:100});
            core.setOutput('approvers',currentApprovers(reviews, process.env.HEAD_SHA).join(','));
            core.setOutput('read','yes');
      - name: Validate using only base-branch code
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          AUTHOR: ${{ needs.prepare.outputs.author }}
          APPROVERS: ${{ steps.reviews.outputs.approvers }}
          MARKET_ADMINS: ${{ vars.MARKET_ADMINS }}
          MARKET_REPO: ${{ github.repository }}
        run: |
          node rules/scripts/validate.mjs --root candidate --base-ref "$BASE" --owners-file rules/owners.json \
            --pr-files "$RUNNER_TEMP/market-changed" --pr-author "$AUTHOR" --approvers "$APPROVERS" --admins "$MARKET_ADMINS"
          node rules/scripts/build-manifest.mjs --repo candidate --check --base-ref "$BASE"

  report:
    needs: [prepare, validate]
    if: always() && needs.prepare.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: rules
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          NUMBER: ${{ needs.prepare.outputs.number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          BASE: ${{ needs.prepare.outputs.base }}
          CHECK_RESULT: ${{ needs.validate.result }}
          APPROVERS: ${{ needs.validate.outputs.approvers }}
          REVIEWS_READ: ${{ needs.validate.outputs.reviews_read }}
        with:
          script: |
            const {owner,repo} = context.repo;
            const number=Number(process.env.NUMBER);
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:number});
            if(pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA || pr.base.sha !== process.env.BASE) return;
            if (process.env.REVIEWS_READ === 'yes') {
              const {currentApprovers} = await import(process.env.GITHUB_WORKSPACE + '/rules/scripts/reviews.mjs');
              const reviews = await github.paginate(github.rest.pulls.listReviews,{owner,repo,pull_number:number,per_page:100});
              if (currentApprovers(reviews,pr.head.sha).join(',') !== process.env.APPROVERS) return;
            }
            const state=process.env.CHECK_RESULT === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({owner,repo,sha:pr.head.sha,context:'market/pr-validate',state,
              target_url:process.env.GITHUB_SERVER_URL+'/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              description:state==='success' ? 'Market package and reviews verified' : 'Market package or current approvals failed'});

